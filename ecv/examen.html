<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación virtual · Aula Virtual</title>
<!-- ÚNICA página de evaluación virtual (tipo "ecv"). Recibe ?s=ecvfu2
     alumno  -> quiz en diapositivas (10 al azar, alternativas barajadas, anti-trampa)
     docente -> alumnos por grupo y, al hacer clic, detalle con aciertos/desaciertos
                (rojo = fallo, amarillo = correcta), nota + hora + corrección + reinicio -->
<script src="config.js"></script>
<script src="../access/access.js" data-proteger data-sin-barra></script>
<link rel="icon" type="image/png" href="../access/favicon.png">
<link rel="apple-touch-icon" href="../access/icono.png">
<link rel="stylesheet" href="../access/estilo.css">
<style>
  .volver { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-size: .85rem; font-weight: 600; margin-bottom: 18px; }
  .volver:hover { color: var(--acc-d); }
  .cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { font-family: var(--mono); font-size: .75rem; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .stat b { color: var(--acc-d); font-size: 1rem; margin-right: 4px; }

  .grupo { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 10px; font-size: 1.05rem; }
  .grupo::after { content: ""; flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }
  .grupo-row { display: flex; align-items: center; gap: 12px; margin: 24px 0 10px; }
  .grupo-row .grupo { flex: 1; margin: 0; }
  .tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .buscar { position: relative; flex: 1 1 260px; }
  .buscar input { width: 100%; padding: 12px 14px 12px 40px; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  .buscar input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(53,81,63,.14); }
  .buscar svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--mut); }
  .ov { position: fixed; inset: 0; z-index: 130; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(16,35,28,.4); backdrop-filter: blur(3px); }
  .ov.on { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(16,35,28,.25); }
  .modal h2 { font-size: 1.1rem; margin: 0 0 6px; }
  .modal p { color: var(--ink-2); font-size: .88rem; margin: 0 0 14px; }
  .modal input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); font: inherit; }
  .modal .err { color: var(--err); font-size: .82rem; min-height: 1.2em; margin: 8px 0 0; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .alumnos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }

  button.alumno {
    display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
    color: var(--ink); font: inherit; transition: border-color .15s, background .15s, transform .15s;
  }
  button.alumno:hover { border-color: var(--acc); background: var(--acc-bg); transform: translateY(-1px); }
  button.alumno .t { min-width: 0; flex: 1; }
  button.alumno .nom { display: block; font-size: .85rem; font-weight: 600; line-height: 1.25; }
  button.alumno .cod { display: block; font-family: var(--mono); font-size: .68rem; color: var(--mut); margin-top: 1px; }
  button.alumno .g { flex: none; font-family: var(--mono); font-size: .72rem; font-weight: 700; color: var(--paper); background: var(--ink); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }
  button.alumno .g.ok { background: var(--moss); }
  button.alumno .g.cor { background: var(--amber); }
  button.alumno.sin { opacity: .6; }

  .ficha { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 24px; box-shadow: 0 10px 28px rgba(16,35,28,.06); }
  .ficha-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .ficha-top b { font-size: 1.05rem; }
  .ficha-top .mono { font-size: .72rem; color: var(--mut); }
  .ficha-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; font-size: .85rem; color: var(--ink-2); }
  .ficha-meta .nota { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--acc-d); line-height: 1; }
  .ficha-meta .nota small { font-size: .7rem; font-weight: 600; display: block; color: var(--mut); }
  .ficha-meta .tachada { font-family: var(--mono); font-size: 1rem; text-decoration: line-through; text-decoration-thickness: 2px; color: var(--err); }
  .ficha-meta .hora, .ficha-meta .aciertos, .ficha-meta .incid { font-family: var(--mono); font-size: .74rem; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
  .ficha-meta .incid { color: var(--amber-d); border-color: #ecd3a8; }

  .pregunta-det { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .pregunta-det.ok { border-left: 4px solid var(--moss); }
  .pregunta-det.fallo { border-left: 4px solid var(--err); }
  .pregunta-det-q { font-weight: 600; margin-bottom: 8px; }
  .opciones-det { display: grid; gap: 6px; }
  .opcion-det { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; font-size: .88rem; background: var(--paper); }
  .opcion-det.correcta { background: #fff3b0; border-color: #e0b000; }
  .opcion-det.mal { background: #fdecea; border-color: #c62828; color: #7d211b; }
  .opcion-det .marca { flex: none; font-weight: 700; }

  .ficha-acciones { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 14px; }
  .correccion { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .correccion label { font-size: .8rem; font-weight: 600; }
  .correccion input { width: 90px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }

  /* ---------- alumno: quiz ---------- */
  .centrado { min-height: 60vh; display: grid; place-items: center; text-align: center; }
  .tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; max-width: 460px; width: 100%; box-shadow: 0 14px 40px rgba(16,35,28,.07); }
  .tarjeta h1 { font-size: 1.3rem; margin: 14px 0 6px; letter-spacing: -.01em; }
  .tarjeta p { color: var(--ink-2); margin: 0 0 4px; font-size: .92rem; }
  .tarjeta .btn { margin-top: 18px; }
  .icono-ok, .icono-aviso { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto; }
  .icono-ok { background: var(--moss-bg); color: var(--moss-d); }
  .icono-aviso { background: var(--amber-bg); color: var(--amber-d); }
  .icono-ok svg, .icono-aviso svg { width: 24px; height: 24px; }
  .nota-big { font-family: var(--mono); font-size: 3.4rem; font-weight: 700; color: var(--moss-d); line-height: 1; margin: 6px 0 2px; }
  .nota-big small { display: block; font-family: var(--sans); font-size: .85rem; color: var(--mut); font-weight: 500; margin-top: 4px; }
  .incid { font-size: .82rem; color: var(--amber-d); background: var(--amber-bg); border: 1px solid #ecd3a8; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .advertencia { font-size: .85rem; color: #7a4d10; background: var(--amber-bg); border: 1px solid #ecd3a8; border-radius: 10px; padding: 12px 14px; margin: 14px 0 0; text-align: left; }

  .quiz { max-width: 680px; margin: 8px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px; box-shadow: 0 14px 40px rgba(16,35,28,.07); animation: sube .3s ease both; }
  .barra { height: 8px; background: var(--paper); border-radius: 9px; overflow: hidden; margin-bottom: 10px; }
  .barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--moss), #5a7d67); transition: width .3s; }
  .contador { font-family: var(--mono); font-size: .74rem; color: var(--mut); text-align: right; margin-bottom: 14px; }
  .quiz h1.pregunta { font-size: 1.25rem; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 18px; }
  .opciones { display: grid; gap: 10px; }
  button.opcion { width: 100%; text-align: left; padding: 13px 15px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; font: inherit; font-size: .95rem; transition: border-color .15s, background .15s; }
  button.opcion:hover { border-color: var(--acc); background: var(--acc-bg); }
  .alerta { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 120; display: none; max-width: 90vw; background: #7d211b; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: .85rem; box-shadow: 0 12px 30px rgba(16,35,28,.3); }
  .alerta.on { display: block; animation: sube .3s ease both; }
</style>

<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="plate" href="../index.html">
        <span class="plate-mark"><img src="../access/icono.png" alt=""></span>
        <span class="plate-txt"><b>Aula Virtual</b><small>Herramientas Informáticas</small></span>
      </a>
      <div class="who-chip">
        <i class="dot"></i><span id="quien"></span>
        <button class="btn ghost sm" id="salir" type="button">Salir</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="app"></main>

<script>
const app = document.getElementById("app");
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const barajar = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [x[i], x[j]] = [x[j], x[i]]; } return x; };
const fmtHora = iso => { try { return new Date(iso).toLocaleString("es-PE", { dateStyle: "medium", timeStyle: "short" }); } catch { return iso; } };

const ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICO_ALERTA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';

/* ---------- banco de preguntas ---------- */
function parseBanco(texto) {
  const filas = Acceso.parseCSV(texto);
  let ini = 0;
  if (filas.length && filas[0].filter(x => x.trim()).length === 1) ini = 1;
  const cab = (filas[ini] || []).map(h => Acceso.norm(h).replace(/[^a-z0-9]+/g, " ").trim());
  const col = name => cab.indexOf(name);
  const iN = col("n"), iPreg = col("pregunta");
  const iTema = cab.findIndex(h => h === "tema" || h === "categoria" || h === "temas");
  const letras = ["a", "b", "c", "d", "e"];
  const preguntas = [];
  for (let i = ini + 1; i < filas.length; i++) {
    const f = filas[i];
    const texto = (f[iPreg] || "").trim();
    if (!texto) continue;
    const alts = []; let correcta = null;
    letras.forEach((L, j) => {
      const raw = (f[col(L)] || "").trim();
      if (!raw) return;
      let ok = false, val = raw;
      if (raw.endsWith("*")) { ok = true; val = raw.slice(0, -1).trim(); }
      alts.push({ letra: "ABCDE"[j], texto: val });
      if (ok) correcta = "ABCDE"[j];
    });
    if (!correcta || alts.length < 2) continue;   // pregunta sin correcta o incompleta: se ignora
    preguntas.push({ n: (f[iN] || "").trim() || String(i - ini), tema: (f[iTema] || "").trim(), texto, alts, correcta });
  }
  return preguntas;
}

/* ---------- resultados (Apps Script / servidor local + respaldo en el navegador) ---------- */
const CLAVE_RES = "ecv-res-";
const API_RES = (window.CONFIG_ECV_API || "").trim();

async function guardarNube(body) {
  // Apps Script prefiere text/plain para evitar el preflight de CORS
  if (API_RES) return fetch(API_RES, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return fetch("/api/guardar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

async function leerResultados(id) {
  let nube = null;
  try {
    if (API_RES) {
      const r = await fetch(API_RES + "?sesion=" + encodeURIComponent(id), { cache: "no-store" });
      if (r.ok) nube = await r.json();
    } else {
      const r = await fetch(Acceso.url("ecv/resultados_" + id + ".json"), { cache: "no-store" });
      if (r.ok) nube = await r.json();
    }
  } catch {}
  let local = {}; try { local = JSON.parse(localStorage.getItem(CLAVE_RES + id) || "{}"); } catch {}
  return Object.assign({}, local, nube || {});
}

async function guardarResultado(id, codigo, resultado, borrar) {
  let local = {}; try { local = JSON.parse(localStorage.getItem(CLAVE_RES + id) || "{}"); } catch {}
  if (borrar) delete local[codigo]; else local[codigo] = resultado;
  try { localStorage.setItem(CLAVE_RES + id, JSON.stringify(local)); } catch {}
  try { await guardarNube({ sesion: id, codigo, resultado, borrar: !!borrar }); } catch {}
}

async function borrarResultados(id, codigos) {
  if (!codigos || !codigos.length) return;
  let local = {}; try { local = JSON.parse(localStorage.getItem(CLAVE_RES + id) || "{}"); } catch {}
  codigos.forEach(c => delete local[c]);
  try { localStorage.setItem(CLAVE_RES + id, JSON.stringify(local)); } catch {}
  try { await guardarNube({ sesion: id, codigos, borrar: true }); } catch {}
}

/* ---------- aviso genérico ---------- */
function aviso(titulo, texto) {
  const c = el("div", "centrado anim"), t = el("div", "tarjeta");
  const ic = el("div", "icono-aviso"); ic.innerHTML = ICO_ALERTA;
  const a = el("a", "btn", "Volver al inicio"); a.href = Acceso.url("index.html");
  t.append(ic, el("h1", "", titulo), el("p", "", texto), a);
  c.appendChild(t); app.replaceChildren(c);
}

/* ============ ALUMNO ============ */
function vistaAlumno(info, banco, resultados) {
  const s = Acceso.sesion();
  const previo = resultados[s.codigo];
  if (previo) { mostrarNota(info, previo, true); return; }
  mostrarInicio(info, banco);
}

function mostrarInicio(info, banco) {
  app.replaceChildren();
  const c = el("div", "centrado anim"), t = el("div", "tarjeta");
  t.append(
    el("p", "eyebrow", info.etiqueta),
    el("h1", "", "Evaluación virtual"),
    el("p", "", `Tendrás ${Math.min(10, banco.length)} preguntas elegidas al azar. Cada intento es distinto y no se puede volver atrás.`),
    el("div", "advertencia", "⚠️ Esta evaluación detecta si cambias de pestaña o minimizas la ventana. Esos eventos quedan registrados con la hora y se informan a tu docente."),
    el("button", "btn block", "Comenzar evaluación")
  );
  t.lastChild.onclick = () => comenzar(info, banco);
  c.appendChild(t); app.appendChild(c);
}

function comenzar(info, banco) {
  const s = Acceso.sesion();
  const total = Math.min(10, banco.length);
  const examen = barajar(banco).slice(0, total).map(q => ({ n: q.n, texto: q.texto, tema: q.tema, correcta: q.correcta, orden: barajar(q.alts.map(a => a.letra)), alts: q.alts }));
  const respuestas = [];
  let incidentes = 0, idx = 0;

  const alerta = el("div", "alerta"); alerta.id = "alertaTrampa";
  document.body.appendChild(alerta);
  let _ult = 0;
  function incidente() {
    const now = Date.now(); if (now - _ult < 600) return; _ult = now;
    incidentes++;
    alerta.textContent = "⚠️ Incidente " + incidentes + ": saliste de la pestaña o minimizaste (" + fmtHora(new Date().toISOString()) + ").";
    alerta.classList.add("on");
    clearTimeout(incidente._t); incidente._t = setTimeout(() => alerta.classList.remove("on"), 5000);
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) incidente(); });
  window.addEventListener("blur", incidente);

  function pintar() {
    app.replaceChildren();
    if (idx >= examen.length) { terminar(); return; }
    const q = examen[idx];
    const quiz = el("div", "quiz");
    const bar = el("div", "barra"); const bi = el("i"); bi.style.width = (idx / examen.length * 100) + "%"; bar.appendChild(bi);
    quiz.appendChild(bar);
    quiz.appendChild(el("div", "contador", `${idx + 1} / ${examen.length}${q.tema ? " · " + q.tema : ""}`));
    quiz.appendChild(el("h1", "pregunta", q.texto));
    const ops = el("div", "opciones");
    q.orden.forEach(letra => {
      const alt = q.alts.find(a => a.letra === letra);
      const b = el("button", "opcion", alt.texto); b.type = "button";
      b.onclick = () => { respuestas.push({ n: q.n, orden: q.orden, elegida: letra, ok: letra === q.correcta }); idx++; pintar(); };
      ops.appendChild(b);
    });
    quiz.appendChild(ops);
    app.appendChild(quiz);
  }

  function terminar() {
    const aciertos = respuestas.filter(r => r.ok).length;
    const resultado = { aciertos, total: examen.length, hora: new Date().toISOString(), incidentes, correccion: null, respuestas };
    guardarResultado(info.id, s.codigo, resultado).then(() => mostrarNota(info, resultado, false));
  }

  pintar();
}

function mostrarNota(info, r, previa) {
  const nota20 = Math.round(r.aciertos / r.total * 20 * 10) / 10;
  app.replaceChildren();
  const c = el("div", "centrado anim"), t = el("div", "tarjeta");
  const ic = el("div", "icono-ok"); ic.innerHTML = ICO_OK;
  const h = el("h1", "", previa ? "Ya rendiste esta evaluación" : "Evaluación finalizada");
  const big = el("div", "nota-big", String(nota20));
  big.appendChild(el("small", "", "sobre 20"));
  t.append(ic, h, big, el("p", "", `Acertaste ${r.aciertos} de ${r.total} preguntas.`));
  if (r.incidentes) t.appendChild(el("div", "incid", `⚠️ Se registraron ${r.incidentes} incidente(s) de cambio de pestaña o minimizado.`));
  const b = el("button", "btn block", "Finalizar todo"); b.type = "button";
  b.onclick = () => location.href = Acceso.url("index.html");
  t.appendChild(b);
  c.appendChild(t); app.appendChild(c);
}

/* ============ DOCENTE ============ */
async function vistaDocente(info, banco, resultados) {
  const acceso = await Acceso.cargarAccess();
  const alumnos = (acceso || []).filter(p => p.rol !== "docente");
  const grupos = [...new Set(alumnos.map(a => a.grupo || "Sin grupo"))].sort();
  let selCodigo = null;
  let filtro = "";
  const docente = (acceso || []).find(p => p.rol === "docente");

  const volver = el("a", "volver"); volver.href = Acceso.url("index.html"); volver.innerHTML = "← Volver al inicio";
  app.replaceChildren(volver);

  const cab = el("div", "cab anim"), izq = el("div");
  izq.append(el("p", "eyebrow", "Evaluación virtual · vista docente"),
             el("h1", "titulo", info.etiqueta),
             el("p", "lede", "Presiona un alumno para ver sus preguntas y aciertos (rojo = fallo, amarillo = correcta), su nota, la hora y los incidentes. También puedes corregir la nota o reiniciar su intento."));
  const stats = el("div", "stats");
  const rindieron = alumnos.filter(a => resultados[a.codigo]).length;
  stats.append(stat(String(rindieron), "rindieron"), stat(String(alumnos.length), "inscritos"));
  cab.append(izq, stats);
  app.appendChild(cab);

  const tools = el("div", "tools anim");
  const bus = el("div", "buscar"); bus.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>';
  const q = el("input"); q.type = "search"; q.placeholder = "Buscar alumno por nombre o código…"; q.autocomplete = "off";
  bus.appendChild(q); tools.appendChild(bus);
  app.appendChild(tools);
  q.addEventListener("input", () => { filtro = q.value; pintarLista(); });

  const det = el("div"); det.id = "detalle";
  app.appendChild(det);
  const lista = el("div"); app.appendChild(lista);

  function stat(b, t) { const x = el("div", "stat"); x.append(el("b", "", b), t); return x; }

  function pintarLista() {
    lista.replaceChildren();
    const palabras = Acceso.norm(filtro).split(/\s+/).filter(Boolean);
    let mostrados = 0;
    for (const g of grupos) {
      const delGrupo = alumnos.filter(a => (a.grupo || "Sin grupo") === g);
      const hits = delGrupo.filter(a => !palabras.length || palabras.every(w => Acceso.norm(a.nombre + " " + a.codigo).includes(w)));
      if (!hits.length) continue;
      mostrados += hits.length;
      const hrow = el("div", "grupo-row");
      const h = el("h2", "grupo", "Grupo " + g.replace(/^G/i, ""));
      const rbtn = el("button", "btn sm ghost", "Reiniciar grupo"); rbtn.type = "button";
      rbtn.onclick = () => pedirClaveGrupo(g);
      hrow.append(h, rbtn);
      lista.appendChild(hrow);
      const grid = el("div", "alumnos");
      hits.forEach(a => {
        const r = resultados[a.codigo];
        const b = el("button", "alumno" + (r ? "" : " sin")); b.type = "button";
        const t = el("span", "t");
        t.append(el("span", "nom", a.nombre), el("span", "cod", a.codigo));
        b.appendChild(t);
        const gtag = el("span", "g" + (r ? (r.correccion != null ? " cor" : " ok") : ""),
          r ? (r.correccion != null ? r.correccion : Math.round(r.aciertos / r.total * 20 * 10) / 10) : "—");
        b.appendChild(gtag);
        b.onclick = () => { selCodigo = a.codigo; pintarDetalle(); };
        grid.appendChild(b);
      });
      lista.appendChild(grid);
    }
    if (!mostrados) lista.appendChild(el("p", "vacio", "Ningún alumno coincide con la búsqueda."));
  }

  function pintarDetalle() {
    det.replaceChildren();
    if (!selCodigo) { det.appendChild(el("p", "vacio", "Selecciona un alumno para ver su detalle.")); return; }
    const a = alumnos.find(x => x.codigo === selCodigo);
    const r = resultados[selCodigo];
    if (!r) { det.appendChild(el("p", "vacio", `${a.nombre} aún no rinde esta evaluación.`)); return; }

    const nota20 = Math.round(r.aciertos / r.total * 20 * 10) / 10;
    const card = el("div", "ficha");

    const top = el("div", "ficha-top");
    top.append(el("b", "", a.nombre), el("span", "mono", a.codigo + " · Grupo " + (a.grupo || "—")));
    card.appendChild(top);

    const meta = el("div", "ficha-meta");
    meta.append(el("span", "", "Nota:"));
    if (r.correccion != null) {
      meta.append(el("span", "tachada", String(nota20)));
      const nEl = el("span", "nota", String(r.correccion)); nEl.appendChild(el("small", "", "corrección"));
      meta.append(nEl);
    } else {
      const nEl = el("span", "nota", String(nota20)); nEl.appendChild(el("small", "", "sobre 20"));
      meta.append(nEl);
    }
    meta.append(el("span", "aciertos", `${r.aciertos}/${r.total} correctas`));
    meta.append(el("span", "hora", "🕒 " + fmtHora(r.hora)));
    if (r.incidentes) meta.append(el("span", "incid", "⚠️ " + r.incidentes + " incidente(s)"));
    card.appendChild(meta);

    const porN = {}; banco.forEach(q => porN[q.n] = q);
    (r.respuestas || []).forEach((resp, i) => {
      const q = porN[resp.n];
      if (!q) return;
      const pq = el("div", "pregunta-det" + (resp.ok ? " ok" : " fallo"));
      pq.appendChild(el("div", "pregunta-det-q", `${i + 1}. ${q.texto}`));
      const ops = el("div", "opciones-det");
      (resp.orden || q.alts.map(x => x.letra)).forEach(letra => {
        const alt = q.alts.find(x => x.letra === letra);
        if (!alt) return;
        const esCorrecta = letra === q.correcta;
        const esElegida = letra === resp.elegida;
        const o = el("div", "opcion-det" + (esCorrecta ? " correcta" : "") + (esElegida && !resp.ok ? " mal" : ""), alt.texto);
        if (esElegida) o.prepend(el("span", "marca", resp.ok ? "✓" : "✗"));
        ops.appendChild(o);
      });
      pq.appendChild(ops);
      card.appendChild(pq);
    });

    const acc = el("div", "ficha-acciones");
    const corr = el("div", "correccion");
    corr.appendChild(el("label", "", "Nota de corrección (0–20):"));
    const inp = el("input"); inp.type = "number"; inp.min = 0; inp.max = 20; inp.step = 0.5; inp.placeholder = "Opcional";
    if (r.correccion != null) inp.value = r.correccion;
    const guardar = el("button", "btn sm", "Guardar corrección"); guardar.type = "button";
    guardar.onclick = async () => {
      const v = parseFloat(inp.value);
      const r2 = { ...r };
      r2.correccion = (isNaN(v) || inp.value.trim() === "") ? null : Math.max(0, Math.min(20, v));
      await guardarResultado(info.id, selCodigo, r2, false);
      resultados[selCodigo] = r2;
      pintarDetalle(); pintarLista();
    };
    corr.append(inp, guardar);
    acc.appendChild(corr);

    const reiniciar = el("button", "btn sm ghost", "Reiniciar evaluación"); reiniciar.type = "button";
    reiniciar.onclick = async () => {
      if (!confirm("¿Reiniciar la evaluación de " + a.nombre + "? Se borrará su nota actual.")) return;
      await guardarResultado(info.id, selCodigo, null, true);
      delete resultados[selCodigo];
      selCodigo = null;
      pintarDetalle(); pintarLista();
    };
    acc.appendChild(reiniciar);
    card.appendChild(acc);

    det.appendChild(card);
    det.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function pedirClaveGrupo(g) {
    const codes = alumnos.filter(a => (a.grupo || "Sin grupo") === g && resultados[a.codigo]).map(a => a.codigo);
    if (!codes.length) { alert("No hay entregas para reiniciar en el grupo " + g + "."); return; }
    const ov = el("div", "ov on");
    const modal = el("div", "modal");
    modal.append(
      el("h2", "", "Reiniciar grupo " + g.replace(/^G/i, "")),
      el("p", "", `Se borrarán las notas de ${codes.length} alumno(s). Ingresa tu contraseña de docente.`)
    );
    const inp = el("input"); inp.type = "password"; inp.placeholder = "Contraseña"; inp.autocomplete = "off";
    const err = el("div", "err");
    const row = el("div", "row");
    const cancel = el("button", "btn ghost sm", "Cancelar"); cancel.type = "button";
    const ok = el("button", "btn sm", "Reiniciar"); ok.type = "button";
    row.append(cancel, ok);
    modal.append(inp, err, row);
    ov.appendChild(modal);
    document.body.appendChild(ov);
    inp.focus();
    const cerrar = () => ov.remove();
    cancel.onclick = cerrar;
    ov.addEventListener("click", e => { if (e.target === ov) cerrar(); });
    const ejecutar = async () => {
      err.textContent = "";
      if (!docente) { err.textContent = "No se encontró la cuenta del docente."; return; }
      if (!(await Acceso.validar(docente, inp.value))) { err.textContent = "Contraseña incorrecta."; inp.select(); return; }
      if (!confirm(`¿Confirmas reiniciar TODO el grupo ${g.replace(/^G/i, "")}? Se borrarán ${codes.length} nota(s).`)) return;
      await borrarResultados(info.id, codes);
      codes.forEach(c => delete resultados[c]);
      cerrar();
      if (selCodigo && codes.includes(selCodigo)) selCodigo = null;
      pintarLista();
      pintarDetalle();
    };
    ok.onclick = ejecutar;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") ejecutar(); });
  }

  pintarLista();
  pintarDetalle();
}

/* ============ arranque ============ */
(async () => {
  await Acceso.listo;
  const s = Acceso.sesion();
  document.getElementById("quien").textContent = s.nombre;
  document.getElementById("salir").onclick = Acceso.salir;

  const id = new URLSearchParams(location.search).get("s");
  const info = Acceso.idSesion(id);
  if (!info || info.tipo !== "ecv") { aviso("Evaluación no válida", "El enlace no corresponde a una evaluación virtual."); return; }
  document.title = info.etiqueta + " · Aula Virtual";

  const csv = await Acceso.textoCSV(info.carpeta + info.id + ".csv");
  if (!csv) { aviso(info.etiqueta, "No se encontró el banco de preguntas (ecv/" + info.id + ".csv). Avisa a tu docente."); return; }
  const banco = parseBanco(csv);
  if (!banco.length) { aviso(info.etiqueta, "El banco de preguntas está vacío o mal formado."); return; }

  const resultados = await leerResultados(info.id);

  if (s.rol === "docente") vistaDocente(info, banco, resultados);
  else vistaAlumno(info, banco, resultados);
})();
</script>
